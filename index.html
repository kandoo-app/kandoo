<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kandoo | کندو</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Vazirmatn', sans-serif;
    background: radial-gradient(circle at 50% 30%, #0e4534 0%, #0a3527 60%, #082b20 100%);
    overflow: hidden;
    position: relative;
  }
  .hex-bg {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(60deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 60px),
      repeating-linear-gradient(-60deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 60px);
    z-index: 0;
  }
  .screen {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .logo-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeInScale 0.9s ease-out;
  }
  .logo-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .k-letter {
    position: absolute;
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    font-family: Arial, sans-serif;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -52%);
  }
  .app-name {
    color: #ffffff;
    font-size: 44px;
    font-weight: 900;
    margin-top: 28px;
    animation: fadeIn 1.1s ease-out;
  }
  .tagline-wrap {
    margin-top: 18px;
    text-align: center;
    animation: fadeIn 1.3s ease-out;
  }
  .tagline {
    color: rgba(255,255,255,0.92);
    font-size: 16px;
    font-weight: 500;
  }
  .squiggle { margin-top: 6px; }
  .dots {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 10px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }
  .dot.active {
    background: #e8a13a;
    width: 22px;
    border-radius: 4px;
  }
  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.75); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="hex-bg"></div>
  <div class="screen">
    <div class="logo-wrap">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f2c14e"/>
            <stop offset="45%" stop-color="#e8823e"/>
            <stop offset="100%" stop-color="#d9524a"/>
          </linearGradient>
        </defs>
        <polygon points="100,15 168,55 168,135 100,175 32,135 32,55"
          fill="none" stroke="url(#hexGrad)" stroke-width="9" stroke-linejoin="round"/>
        <polygon points="152,52 172,63 172,85 152,74" fill="#8dc36a"/>
      </svg>
      <div class="k-letter">k</div>
    </div>
    <div class="app-name">کندو</div>
    <div class="tagline-wrap">
      <div class="tagline">کشف کن، انتخاب کن، لذت ببر.</div>
      <svg class="squiggle" width="120" height="10" viewBox="0 0 120 10">
        <path d="M2,6 Q20,-2 40,6 T80,6 T118,6" fill="none" stroke="#e8a13a" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
