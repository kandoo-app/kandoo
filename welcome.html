<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kandoo | کندو - خوش آمدید</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #f7f3e9; }
  .wrap { position: relative; width: 100%; height: 100%; }
  .bg-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .btn {
    background: rgba(255,0,0,0.4);
    display: block;
    position: absolute;
    width: 82%;
    left: 9%;
  }
  .btn-login { top: 50%; height: 6.5%; }
  .btn-signup { top: 58%; height: 6.5%; }
  .btn-google { top: 71%; height: 6.5%; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="bg-img" src="file_0000000050b481fd92d0b4fb05d5871d.png" alt="Welcome">
    <a href="javascript:doLogin()" class="btn btn-login"></a>
    <a href="login.html" class="btn btn-signup"></a>
    <a href="javascript:alert('ورود با گوگل به زودی فعال می‌شود')" class="btn btn-google"></a>
  </div>

<script>
function doLogin() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function() { window.location.href = 'home.html'; },
      function() { window.location.href = 'home.html'; }
    );
  } else {
    window.location.href = 'home.html';
  }
}
</script>
</body>
</html>
